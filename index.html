    function base64ToArrayBuffer(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    const MIDI_DIR = 'midi/';   // folder next to index.html that holds your hosted .mid files
    const BUILTIN_PIECES = [
      { id: 'faure_pavane.mid', title: 'Fauré — Pavane', load: async () => base64ToArrayBuffer(PAVANE_B64) },
      { id: 'bach_prelude_demo', title: 'Bach — Prelude in C Major (demo)', load: async () => createDemoBachMidiBuffer() }
    ];
    let hostedPieces = [];
    let hostedStatus = 'idle'; // 'loading' | 'ready' | 'empty' | 'error'

    function prettifyName(file) {
      const base = file.split('/').pop().replace(/\.midi?$/i, '').replace(/[_-]+/g, ' ').trim();
      return base.replace(/\b\p{L}/gu, c => c.toUpperCase());
    }

    function hostedPieceFrom(entry) {
      const isObj = entry && typeof entry === 'object';
      const file = isObj ? (entry.file || entry.name || entry.path) : entry;
      if (!file || typeof file !== 'string' || !/\.midi?$/i.test(file)) return null;
      const title = (isObj && entry.title) ? String(entry.title) : prettifyName(file);
      const url = MIDI_DIR + file.split('/').map(encodeURIComponent).join('/');
      return {
        id: file,
        title,
        load: async () => {
          const r = await fetch(url);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        }
      };
    }

    // Fallback when there is no midi/index.json: ask GitHub which files are in the midi folder
    async function listMidiViaGithubApi() {
      const host = location.hostname;
      if (!host.endsWith('.github.io')) return null;
      const owner = host.split('.')[0];
      const first = location.pathname.split('/').filter(Boolean)[0];
      const repo = (first && !/\.html?$/i.test(first)) ? first : host;
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/midi`);
      if (!r.ok) return null;
      const items = await r.json();
      return items.filter(i => i.type === 'file').map(i => i.name);
    }

    async function loadHostedLibrary() {
      hostedStatus = 'loading';
      renderLibrary();

      let entries = null;
      try {
        const r = await fetch(MIDI_DIR + 'index.json', { cache: 'no-cache' });
        if (r.ok) {
          const j = await r.json();
          entries = Array.isArray(j) ? j : (j.files || []);
        }
      } catch (e) {}

      if (!entries) {
        try { entries = await listMidiViaGithubApi(); } catch (e) {}
      }

      if (!entries) {
        hostedStatus = 'error';
        renderLibrary();
        return;
      }

      const seen = new Set(BUILTIN_PIECES.map(p => p.id.toLowerCase()));
      hostedPieces = [];
      for (const entry of entries) {
        const piece = hostedPieceFrom(entry);
        if (piece && !seen.has(piece.id.toLowerCase())) {
          seen.add(piece.id.toLowerCase());
          hostedPieces.push(piece);
        }
      }
      hostedStatus = hostedPieces.length ? 'ready' : 'empty';
      renderLibrary();
    }

    function renderLibrary() {
      libraryList.textContent = '';

      const addHeader = (text) => {
        const h = document.createElement('div');
        h.className = 'px-2 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wider text-stone-500';
        h.textContent = text;
        libraryList.appendChild(h);
      };
      const addNote = (text) => {
        const n = document.createElement('div');
        n.className = 'px-3 py-2 text-xs text-stone-500 leading-relaxed';
        n.textContent = text;
        libraryList.appendChild(n);
      };
      const addItem = (piece) => {
        const b = document.createElement('button');
        b.type = 'button';
        const active = state.currentLibraryId === piece.id;
        b.className = 'w-full text-left px-3 py-2.5 rounded-lg text-sm transition ' +
          (active ? 'bg-white font-semibold text-stone-900 shadow-sm' : 'text-stone-700 hover:bg-white');
        b.textContent = (active ? '♪ ' : '') + piece.title;
        b.addEventListener('click', () => openLibraryPiece(piece));
        libraryList.appendChild(b);
      };

      addHeader('Built-in');
      BUILTIN_PIECES.forEach(addItem);

      addHeader('Online library');
      hostedPieces.forEach(addItem);
      if (hostedStatus === 'loading') addNote('Loading…');
      else if (hostedStatus === 'error') addNote('Online library not reachable (it works on the hosted site, not from a local file).');
      else if (hostedStatus === 'empty' || hostedStatus === 'ready') addNote('Add .mid files to the midi/ folder of your site and they will show up here.');
    }

    async function openLibraryPiece(piece) {
      libraryPopover.classList.add('hidden');
      try {
        const buf = await piece.load();
        await loadSongFromBuffer(buf, piece.title, piece.id);
      } catch (err) {
        showToast('Could not load ' + piece.title);
      }
    }

    // Parse a MIDI buffer and make it the current piece
    async function loadSongFromBuffer(buf, title, id, silent) {
      setPlaying(false);
      const parsed = parseMidiFile(buf, title);
      if (!parsed.notes.length) {
        throw new Error('No playable notes found in MIDI');
      }
      state.song = parsed;
      state.learnSteps = buildLearnSteps(parsed);
      state.kbRange = computeKeyboardRange(parsed);
      state.currentLibraryId = id || null;
      pieceTitleEl.textContent = parsed.title;
      resetToStart();
      renderLibrary();
      if (!silent) showToast(`Loaded: ${parsed.title}`);
    }

    // Load MIDI File from device Files / Computer
    midiFileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      try {
        const buf = await file.arrayBuffer();
        const cleanName = file.name.replace(/\.(mid|midi)$/i, '');
        await loadSongFromBuffer(buf, cleanName, null);
      } catch (err) {
        showToast(err && /No playable/.test(err.message) ? 'No playable notes found in MIDI' : 'Could not read MIDI file');
      } finally {
        midiFileInput.value = '';
      }
    });

    // --------------------------------------------------------------------------
    // 7c. SETTINGS
    // --------------------------------------------------------------------------
    function applySettingsToUI() {
      setMetronomeEl.checked = !!state.settings.metronome;
      setCountInEl.checked = !!state.settings.countIn;
      setToleranceEl.value = state.settings.toleranceMs;
      tolValueEl.textContent = state.settings.toleranceMs + ' ms';
      setKeyboardEl.checked = !!state.settings.showKeyboard;
      kbWrap.style.display = state.settings.showKeyboard ? '' : 'none';
    }

    setMetronomeEl.addEventListener('change', () => {
      state.settings.metronome = setMetronomeEl.checked;
      alignMetronome();
      saveSettings();
    });
    setCountInEl.addEventListener('change', () => {
      state.settings.countIn = setCountInEl.checked;
      saveSettings();
    });
    setToleranceEl.addEventListener('input', () => {
      state.settings.toleranceMs = parseInt(setToleranceEl.value, 10) || 0;
      tolValueEl.textContent = state.settings.toleranceMs + ' ms';
      saveSettings();
    });
    setKeyboardEl.addEventListener('change', () => {
      state.settings.showKeyboard = setKeyboardEl.checked;
      applySettingsToUI();
      resizeCanvas();
      saveSettings();
    });

    // --------------------------------------------------------------------------
    // 7d. POPOVERS (USB MIDI ports, Library, Settings)
    // --------------------------------------------------------------------------
    const popovers = [
      { btn: midiPortBtn, pop: midiPopover },
      { btn: libraryBtn, pop: libraryPopover },
      { btn: settingsBtn, pop: settingsPopover }
    ];

    popovers.forEach((entry) => {
      entry.btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const willOpen = entry.pop.classList.contains('hidden');
        popovers.forEach(p => p.pop.classList.add('hidden'));
        if (willOpen) entry.pop.classList.remove('hidden');
        if (entry.btn === midiPortBtn && !state.midiAccess) {
          initWebMIDI();
        }
      });
    });

    document.addEventListener('click', (e) => {
      popovers.forEach(({ btn, pop }) => {
        if (!pop.contains(e.target) && !btn.contains(e.target)) {
          pop.classList.add('hidden');
        }
      });
    });

    midiInSelect.addEventListener('change', () => {
      state.selectedInputId = midiInSelect.value;
      bindSelectedMidiInput();
      updateMidiStatusBadge();
    });

    midiOutSelect.addEventListener('change', () => {
      stopAllMidiNotes();
      state.selectedOutputId = midiOutSelect.value;
      updateMidiStatusBadge();
    });

    // Touch & Mouse Horizontal Scrubbing on Sheet Music Canvas
    function beginScrub(clientX) {
      if (!state.song) return;
      state.isDragging = true;
      state.dragStartX = clientX;
      state.dragStartTick = state.currentTick;
      state.wasPlayingBeforeDrag = state.isPlaying;
      state.countIn = null;
      stopAllMidiNotes();
    }

    function moveScrub(clientX) {
      if (!state.isDragging || !state.song) return;
      const dx = clientX - state.dragStartX;
      const pxPerTick = state.pxPerQuarter / state.song.ticksPerQuarter;
      const newTick = Math.max(0, Math.min(state.song.totalTicks, state.dragStartTick - dx / pxPerTick));
      state.currentTick = newTick;
      if (state.mode === 'learn') {
        syncLearnStepToCurrentTick();
      }
    }

    function endScrub() {
      if (!state.isDragging) return;
      state.isDragging = false;
      state.lastFrameTime = performance.now();
      if (state.mode === 'learn' && state.wasPlayingBeforeDrag) {
        syncLearnStepToCurrentTick();
      }
      alignMetronome();
    }

    canvas.addEventListener('mousedown', (e) => beginScrub(e.clientX));
    window.addEventListener('mousemove', (e) => moveScrub(e.clientX));
    window.addEventListener('mouseup', endScrub);

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        beginScrub(e.touches[0].clientX);
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        moveScrub(e.touches[0].clientX);
      }
    }, { passive: true });

    canvas.addEventListener('touchend', endScrub);
    canvas.addEventListener('touchcancel', endScrub);

    // Spacebar Play/Pause shortcut
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') {
        e.preventDefault();
        setPlaying(!state.isPlaying);
      }
    });

    // Clean up MIDI notes on page close
    window.addEventListener('beforeunload', () => {
      stopAllMidiNotes();
    });

    window.addEventListener('resize', resizeCanvas);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => resizeCanvas());
      ro.observe(container);
      ro.observe(kbWrap);
    }

    // --------------------------------------------------------------------------
    // 8. INITIALIZATION & MAIN ANIMATION LOOP
    // --------------------------------------------------------------------------
    function mainLoop(now) {
      updateSimulation(now);
      renderSheetMusic();
      renderKeyboard();
      requestAnimationFrame(mainLoop);
    }

    window.onload = function () {
      applySettingsToUI();
      resizeCanvas();

      // Default piece: Fauré — Pavane (embedded, so it works even offline / from a local file)
      loadSongFromBuffer(base64ToArrayBuffer(PAVANE_B64), 'Fauré — Pavane', 'faure_pavane.mid', true);
      renderLibrary();
      loadHostedLibrary();

      // Initialize USB MIDI ports
      initWebMIDI();

      requestAnimationFrame(mainLoop);
    };
  </script>
</body>
</html>
